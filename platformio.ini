; PlatformIO Project Configuration File for Robot Sensor Hub
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
    adafruit/Adafruit AHTX0@^2.0.5
    bogde/HX711@^0.7.5
upload_speed = 921600

; ==============================================
; Target: Default Configuration (2 AHT30 + HX711 + 2 Fans)
; ==============================================
[env:default]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
upload_speed = ${common.upload_speed}
build_flags = 
    -DUSE_TARGET_default
    -DCORE_DEBUG_LEVEL=3
; Uncomment and set your port:
; upload_port = /dev/ttyUSB0  ; Linux/Mac
; upload_port = COM3          ; Windows

; ==============================================
; Target: Full Configuration (8 AHT30 + HX711 + 2 Fans)
; ==============================================
[env:full]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
upload_speed = ${common.upload_speed}
build_flags = 
    -DUSE_TARGET_full_config
    -DCORE_DEBUG_LEVEL=3
; Uncomment and set your port:
; upload_port = /dev/ttyUSB0  ; Linux/Mac
; upload_port = COM3          ; Windows

